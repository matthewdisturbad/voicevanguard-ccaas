<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceVanguard CCaaS • Interaction Widget</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --surface: #ffffff;
            --bg-alt: #f1f5f9;
            --text: #0f172a;
            --text-2: #334155;
            --text-3: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --accent: #0057b8;
            --accent-tint: #eff6ff;
            --ok: #15803d;
            --ok-tint: #dcfce7;
            --warn: #b45309;
            --warn-tint: #fef3c7;
            --crit: #b91c1c;
            --crit-tint: #fee2e2;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f17;
                --surface: #111827;
                --bg-alt: #1e293b;
                --text: #f8fafc;
                --text-2: #cbd5e1;
                --text-3: #94a3b8;
                --border: #1e293b;
                --border-strong: #334155;
                --accent: #38bdf8;
                --accent-tint: #0c2d48;
                --ok: #4ade80;
                --ok-tint: #052e16;
                --warn: #fbbf24;
                --warn-tint: #3b2506;
                --crit: #f87171;
                --crit-tint: #3b1219;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            padding: 12px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .brand svg { color: var(--accent); flex-shrink: 0; }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--bg-alt);
            color: var(--text-2);
            border: 1px solid var(--border-strong);
            font-variant-numeric: tabular-nums;
        }
        .badge.ok { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
        .badge.warn { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
        .badge.crit { background: var(--crit-tint); color: var(--crit); border-color: transparent; }
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 10px;
        }
        .meta-row code {
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-alt);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .metric {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
        }
        .metric-label {
            font-size: 11px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .metric-val {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }
        .metric-val.ok { color: var(--ok); }
        .metric-val.warn { color: var(--warn); }
        .metric-val.crit { color: var(--crit); }
        .diag-box {
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-strong);
            background: var(--bg-alt);
        }
        .diag-box.crit { background: var(--crit-tint); color: var(--crit); border-color: transparent; }
        .diag-box.warn { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
        .diag-box.ok { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .field label { font-size: 11px; font-weight: 600; color: var(--text-2); }
        .field input {
            padding: 7px 9px;
            border-radius: 6px;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .lang { display: inline-flex; gap: 2px; margin-left: 6px; }
        .lang button { font: inherit; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; }
        .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border-strong);
            margin-top: 6px;
        }
        .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-3);
            margin-top: 8px;
        }
        .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .err { color: var(--crit); font-size: 12px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="head">
            <div class="brand">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5L4 6v5.5c0 4.7 3.3 8.7 8 10 4.7-1.3 8-5.3 8-10V6l-8-3.5z"/><path d="M8.5 12h1.8l1.2-3 1.8 6 1.2-3h1"/></svg>
                <span>VoiceVanguard CCaaS</span>
            </div>
            <span><span id="connBadge" class="badge">OFFLINE</span><span class="lang" role="group" aria-label="Language"><button type="button" data-lang="pt" aria-pressed="false">PT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></span></span>
        </div>

        <div class="meta-row">
            <span><strong id="lblConv">Interação:</strong> <code id="valConv">--</code></span>
            <span id="envWrap" hidden><strong id="lblEnv">Env:</strong> <code id="valEnv">--</code></span>
        </div>

        <div id="authSection">
            <div id="authError" class="err" hidden></div>
        </div>

        <div id="telemetrySection" hidden>
            <div class="meta-row" id="agentMeta">
                <span><strong id="lblStation">PA:</strong> <code id="valStation">--</code></span>
                <span><strong id="lblOperator">Operador:</strong> <span id="valOperator">--</span></span>
                <span><strong id="lblNet">Rede:</strong> <span id="valNet">--</span></span>
            </div>

            <div class="grid">
                <div class="metric">
                    <div class="metric-label">MOS (G.107)</div>
                    <div class="metric-val" id="valMos">--</div>
                </div>
                <div class="metric">
                    <div class="metric-label" id="lblRtt">Latência (RTT)</div>
                    <div class="metric-val" id="valRtt">--</div>
                </div>
                <div class="metric">
                    <div class="metric-label" id="lblJitter">Jitter</div>
                    <div class="metric-val" id="valJitter">--</div>
                </div>
                <div class="metric">
                    <div class="metric-label" id="lblLoss">Perda</div>
                    <div class="metric-val" id="valLoss">--</div>
                </div>
            </div>

            <div id="diagBox" class="diag-box">Aguardando amostras da conversa...</div>
        </div>

        <div class="foot">
            <span id="tenantLabel">Zero Audio Recording</span>
            <a href="/dashboard" target="_blank" rel="noopener" id="lnkConsole">Abrir console completo →</a>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const rawConv = params.get('conversationId') || '';
            const convId = (rawConv && !rawConv.includes('{{')) ? rawConv.trim() : '';
            const rawEnv = params.get('env') || params.get('environment') || '';
            const pcEnv = (rawEnv && !rawEnv.includes('{{')) ? rawEnv.trim() : '';
            const DICT = {
                pt: {
                    conv: 'Interação:', all: 'Geral', env: 'Ambiente:',
                    notConfigured: 'Widget não configurado: peça ao administrador para incluir a chave do widget na URL da integração.',
                    needConv: 'Abra este widget a partir de uma conversa: o ID da interação não foi informado.',
                    station: 'PA:', operator: 'Operador:', net: 'Rede:', rtt: 'Latência (RTT)', jitter: 'Jitter', loss: 'Perda',
                    waiting: 'Aguardando telemetria WebRTC desta interação...',
                    noMatch: 'Conectado ao relay. Nenhuma PA ativa reportou este ID de conversa ainda.',
                    live: 'EM CHAMADA', audited: 'AUDITADA', online: 'CONECTADO', offline: 'OFFLINE',
                    openConsole: 'Abrir console completo →', invalidKey: 'Chave do widget inválida ou não autorizada.',
                    audioIncident: 'Incidente de áudio: ', degraded: 'Qualidade degradada em ', healthy: 'Fluxo de voz saudável (aproximação G.107).',
                    footer: 'Zero gravação de áudio',
                    audio: { SEM_AUDIO_RECEBIDO: 'Sem áudio recebido', SEM_AUDIO_ENVIADO: 'Sem áudio enviado', MIC_DESCONECTADO: 'Microfone desconectado', MIC_MUDO_SISTEMA: 'Microfone mudo no sistema' },
                    cls: { EXCELENTE: 'Excelente', BOA: 'Boa', DEGRADADA: 'Degradada', 'CRÍTICA': 'Crítica' },
                    cause: { REDE_HOMOLOGADA: 'Rede dentro do esperado', INSTABILIDADE_WI_FI: 'Instabilidade de Wi-Fi', CONGESTIONAMENTO_ROTA: 'Congestionamento na rota', SOBRECARGA_CPU_OPERADOR: 'Sobrecarga do computador do operador', JITTER_INTERMITENTE: 'Jitter intermitente', FALHA_AUDIO_ESTACAO: 'Falha de áudio na estação' },
                    netType: { WI_FI_OR_CELLULAR: 'Wi-Fi ou celular', WI_FI_PROVAVEL: 'Wi-Fi (provável)', CABO_ETHERNET: 'Cabo (Ethernet)', REDE_ESTAVEL: 'Rede estável', ETHERNET: 'Cabo (Ethernet)', 'N/D': 'Não informado' }
                },
                en: {
                    conv: 'Interaction:', all: 'All active', env: 'Environment:',
                    notConfigured: 'Widget not configured: ask your administrator to add the widget key to the integration URL.',
                    needConv: 'Open this widget from a conversation: the interaction ID is missing.',
                    station: 'Workstation:', operator: 'Agent:', net: 'Network:', rtt: 'Latency (RTT)', jitter: 'Jitter', loss: 'Packet loss',
                    waiting: 'Waiting for WebRTC telemetry for this interaction...',
                    noMatch: 'Connected to relay. No active workstation matches this conversation ID yet.',
                    live: 'LIVE CALL', audited: 'AUDITED CALL', online: 'CONNECTED', offline: 'OFFLINE',
                    openConsole: 'Open full console →', invalidKey: 'Invalid or unauthorized widget key.',
                    audioIncident: 'Audio incident: ', degraded: 'Degraded voice quality on ', healthy: 'Voice path healthy (G.107 approximation).',
                    footer: 'Zero audio recording',
                    audio: { SEM_AUDIO_RECEBIDO: 'No incoming audio', SEM_AUDIO_ENVIADO: 'No outgoing audio', MIC_DESCONECTADO: 'Microphone disconnected', MIC_MUDO_SISTEMA: 'Microphone muted by the system' },
                    cls: { EXCELENTE: 'Excellent', BOA: 'Good', DEGRADADA: 'Degraded', 'CRÍTICA': 'Critical' },
                    cause: { REDE_HOMOLOGADA: 'Network within expected range', INSTABILIDADE_WI_FI: 'Wi-Fi instability', CONGESTIONAMENTO_ROTA: 'Route congestion', SOBRECARGA_CPU_OPERADOR: "Overloaded operator computer", JITTER_INTERMITENTE: 'Intermittent jitter', FALHA_AUDIO_ESTACAO: 'Workstation audio failure' },
                    netType: { WI_FI_OR_CELLULAR: 'Wi-Fi or cellular', WI_FI_PROVAVEL: 'Likely Wi-Fi', CABO_ETHERNET: 'Wired (Ethernet)', REDE_ESTAVEL: 'Stable network', ETHERNET: 'Wired (Ethernet)', 'N/D': 'Not reported' }
                }
            };
            // Idioma: parâmetro lang da integração (organização Genesys) > escolha salva > idioma do navegador
            const langParam = (params.get('lang') || '').toLowerCase();
            let lang = 'pt';
            let saved = '';
            try { saved = localStorage.getItem('vv_lang') || ''; } catch (_) {}
            const pick = (v) => (v && !v.includes('{{')) ? (v.startsWith('en') ? 'en' : (v.startsWith('pt') ? 'pt' : '')) : '';
            lang = pick(langParam) || pick(saved) || pick((navigator.language || '').toLowerCase()) || 'en';
            const T = () => DICT[lang];
            const label = (map, code) => (map && map[code]) || code;

            const $ = (id) => document.getElementById(id);
            function applyStatic() {
                const d = T();
                document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
                $('lblConv').textContent = d.conv;
                $('lblEnv').textContent = d.env;
                $('lblStation').textContent = d.station;
                $('lblOperator').textContent = d.operator;
                $('lblNet').textContent = d.net;
                $('lblRtt').textContent = d.rtt;
                $('lblJitter').textContent = d.jitter;
                $('lblLoss').textContent = d.loss;
                $('lnkConsole').textContent = d.openConsole;
                $('valConv').textContent = convId || d.all;
                document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
                if (!$('tenantLabel').dataset.tenant) $('tenantLabel').textContent = d.footer;
            }
            if (pcEnv) {
                $('envWrap').hidden = false;
                $('valEnv').textContent = pcEnv;
            }
            document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
                lang = b.dataset.lang;
                try { localStorage.setItem('vv_lang', lang); } catch (_) {}
                applyStatic();
                if (!$('authSection').hidden) showMessage(currentMessage); else renderMatch();
            }));

            let ws = null;
            // Chave só de leitura do widget, no fragmento da URL (#wk=...): o fragmento nunca vai ao servidor nem a logs de proxy.
            const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
            const widgetKey = (hashParams.get('wk') || '').trim();
            if (widgetKey && history.replaceState) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} }
            let agents = new Map();
            let calls = [];

            function mosClass(mos) {
                const n = Number(mos);
                if (!Number.isFinite(n)) return '';
                if (n >= 4.0) return 'ok';
                if (n >= 3.6) return 'warn';
                return 'crit';
            }

            function renderMatch() {
                let liveAgent = null;
                if (convId) {
                    for (const a of agents.values()) {
                        if (a.currentCallId === convId) { liveAgent = a; break; }
                    }
                }
                if (!liveAgent && !convId) {
                    for (const a of agents.values()) {
                        if (a.callActive) { liveAgent = a; break; }
                    }
                    if (!liveAgent && agents.size === 1) liveAgent = Array.from(agents.values())[0];
                }

                if (liveAgent) {
                    $('connBadge').textContent = T().live;
                    $('connBadge').className = 'badge ' + (liveAgent.status === 'ALERTA' ? 'crit' : 'ok');
                    $('valStation').textContent = liveAgent.station || liveAgent.agentId;
                    $('valOperator').textContent = liveAgent.operator || '--';
                    $('valNet').textContent = liveAgent.networkType ? label(T().netType, liveAgent.networkType) : '--';
                    $('valMos').textContent = liveAgent.mosScore || '--';
                    $('valMos').className = 'metric-val ' + mosClass(liveAgent.mosScore);
                    $('valRtt').textContent = (liveAgent.rttMs ?? '--') + ' ms';
                    $('valJitter').textContent = (liveAgent.jitterMs ?? '--') + ' ms';
                    $('valLoss').textContent = (liveAgent.lossPct ?? '--') + '%';

                    const issue = liveAgent.audioIssue && liveAgent.audioIssue !== 'NONE' ? liveAgent.audioIssue : null;
                    if (issue) {
                        $('diagBox').className = 'diag-box crit';
                        $('diagBox').textContent = T().audioIncident + label(T().audio, issue);
                    } else if (Number(liveAgent.mosScore) < 3.6) {
                        $('diagBox').className = 'diag-box warn';
                        $('diagBox').textContent = T().degraded + (liveAgent.networkType ? label(T().netType, liveAgent.networkType) : 'WebRTC');
                    } else {
                        $('diagBox').className = 'diag-box ok';
                        $('diagBox').textContent = T().healthy;
                    }
                    return;
                }

                const audited = convId ? calls.find(c => c.interactionId === convId) : calls[0];
                if (audited) {
                    $('connBadge').textContent = T().audited;
                    $('connBadge').className = 'badge ' + (audited.classificacao === 'CRÍTICA' ? 'crit' : (audited.classificacao === 'DEGRADADA' ? 'warn' : 'ok'));
                    $('valStation').textContent = audited.station || audited.agentId || '--';
                    $('valOperator').textContent = audited.operator || '--';
                    $('valNet').textContent = audited.networkType ? label(T().netType, audited.networkType) : '--';
                    $('valMos').textContent = Number(audited.mosMedio).toFixed(2);
                    $('valMos').className = 'metric-val ' + mosClass(audited.mosMedio);
                    $('valRtt').textContent = (audited.rttMedioMs ?? '--') + ' ms';
                    $('valJitter').textContent = (audited.jitterPicoMs ?? '--') + ' ms';
                    $('valLoss').textContent = (audited.perdaPacotesPct ?? '--') + '%';
                    $('diagBox').className = 'diag-box ' + (audited.classificacao === 'CRÍTICA' ? 'crit' : 'ok');
                    $('diagBox').textContent = `${label(T().cls, audited.classificacao)} • ${label(T().cause, audited.causaRaiz || 'REDE_HOMOLOGADA')}`;
                    return;
                }

                $('connBadge').textContent = T().online;
                $('connBadge').className = 'badge ok';
                $('diagBox').className = 'diag-box';
                $('diagBox').textContent = T().noMatch;
            }

            function connect(key) {
                if (!key) return;
                $('authError').hidden = true;
                if (ws) { try { ws.close(); } catch (_) {} }
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const sock = new WebSocket(`${proto}//${location.host}`);
                ws = sock;

                sock.onopen = () => {
                    sock.send(JSON.stringify({ type: 'AUTH', key, conversationId: convId }));
                };

                sock.onmessage = (ev) => {
                    try {
                        const msg = JSON.parse(ev.data);
                        if (msg.type === 'AUTH_ERROR') {
                            currentMessage = 'invalidKey'; $('authError').textContent = T().invalidKey;
                            $('authError').hidden = false;
                            $('authSection').hidden = false;
                            $('telemetrySection').hidden = true;
                            return;
                        }
                        if (msg.type === 'INIT_STATE') {
                            $('authSection').hidden = true;
                            $('telemetrySection').hidden = false;
                            $('tenantLabel').dataset.tenant = '1'; $('tenantLabel').textContent = msg.tenant || 'VoiceVanguard';
                            agents.clear();
                            (msg.agents || []).forEach(a => agents.set(`${a.tower || ''}|${a.agentId}`, a));
                            calls = Array.isArray(msg.callHistory) ? msg.callHistory : [];
                            renderMatch();
                        } else if (msg.type === 'TELEMETRY_UPDATE' && msg.payload) {
                            const a = msg.payload;
                            agents.set(`${a.tower || ''}|${a.agentId}`, a);
                            renderMatch();
                        } else if (msg.type === 'NEW_CALL_AUDIT' && msg.payload) {
                            calls.unshift(msg.payload);
                            renderMatch();
                        }
                    } catch (_) {}
                };

                sock.onclose = (ev) => {
                    if (ev.code === 4001) {
                        currentMessage = 'invalidKey'; $('authError').textContent = T().invalidKey;
                        $('authError').hidden = false;
                        $('authSection').hidden = false;
                        $('telemetrySection').hidden = true;
                    }
                };
            }

            let currentMessage = '';
            function showMessage(key) {
                $('authError').textContent = T()[key] || key;
                $('authError').hidden = false;
                $('authSection').hidden = false;
                $('telemetrySection').hidden = true;
            }
            applyStatic();
            $('diagBox').textContent = T().waiting;
            if (!convId) showMessage(currentMessage = 'needConv');
            else if (!widgetKey) showMessage(currentMessage = 'notConfigured');
            else connect(widgetKey);
        })();
    </script>
</body>
</html>
