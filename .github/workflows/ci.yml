name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_Cloud_Relay_Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 01_Cloud_Relay_Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verificar sintaxe da extensão
        working-directory: 03_Chrome_Edge_Extension
        run: for f in *.js; do node --check "$f"; done
      - name: Paridade de idiomas da landing (pt/en)
        working-directory: .
        run: node scripts/check-i18n.js
